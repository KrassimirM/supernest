name: Build CRV Optimizer v1.7.5 Win7 x86

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'build/win7-x86-crv-optimizer-v1.7.5-20260812'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and extract optimizer source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'win7_build\\v175.b64.part*' | Sort-Object Name
          if ($parts.Count -ne 2) { throw "Expected 2 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('win7_build\\v175_slim.zip', [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path 'win7_build\\src' | Out-Null
          Expand-Archive -Path 'win7_build\\v175_slim.zip' -DestinationPath 'win7_build\\src' -Force
          if (-not (Test-Path 'win7_build\\src\\v175_slim\\app.py')) { throw 'Source extraction failed: app.py not found.' }

      - name: Install Python 3.8.10 x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.python.org/ftp/python/3.8.10/python-3.8.10.exe'
          $installer = "$env:RUNNER_TEMP\\python-3.8.10-x86.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/quiet InstallAllUsers=0 TargetDir=C:\\Python38-x86 Include_launcher=0 Include_test=0 Shortcuts=0' -Wait
          & 'C:\\Python38-x86\\python.exe' -c "import struct,sys; print(sys.version); print('pointer_bits=',struct.calcsize('P')*8); assert struct.calcsize('P')*8 == 32"

      - name: Install PyInstaller
        shell: powershell
        run: |
          & 'C:\\Python38-x86\\python.exe' -m pip install --upgrade 'pip<25'
          & 'C:\\Python38-x86\\python.exe' -m pip install 'pyinstaller==5.13.2'

      - name: Compile source check
        shell: powershell
        run: |
          Set-Location 'win7_build\\src\\v175_slim'
          & 'C:\\Python38-x86\\python.exe' -m py_compile app.py cfb.py crv_model.py support_optimizer.py native_dialogs.py
          if ((Get-Content 'VERSION.txt' -Raw).Trim() -ne '1.7.5') { throw 'VERSION.txt is not 1.7.5' }

      - name: Build one-folder application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'win7_build\\src\\v175_slim'
          & 'C:\\Python38-x86\\python.exe' -m PyInstaller --noconfirm --clean --windowed --onedir --name 'CRV_Cut_Optimizer' app.py
          Copy-Item 'README_BG.md' 'dist\\CRV_Cut_Optimizer\\README_BG.md'
          Copy-Item 'README_EN.md' 'dist\\CRV_Cut_Optimizer\\README_EN.md'
          Copy-Item 'VERSION.txt' 'dist\\CRV_Cut_Optimizer\\VERSION.txt'
          @"
          CRV Cut Optimizer v1.7.5
          Windows 7 compatible x86 build
          Python 3.8.10 32-bit
          PyInstaller 5.13.2
          Build mode: one-folder, windowed
          "@ | Set-Content 'dist\\CRV_Cut_Optimizer\\BUILD_INFO_BG.txt' -Encoding UTF8
          Rename-Item 'dist\\CRV_Cut_Optimizer' 'CRV_Cut_Optimizer_v1.7.5_Win7_x86'

      - name: Verify PE32 x86 executable
        shell: powershell
        run: |
          $exe = 'win7_build\\src\\v175_slim\\dist\\CRV_Cut_Optimizer_v1.7.5_Win7_x86\\CRV_Cut_Optimizer.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($machine -ne 0x014c) { throw "Expected Intel i386 machine 0x014c, got 0x$($machine.ToString('x4'))" }
          if ($magic -ne 0x010b) { throw "Expected PE32 optional-header magic 0x010b, got 0x$($magic.ToString('x4'))" }
          Write-Host 'Verified PE32 / Intel i386 executable.'

      - name: Create ZIP and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'win7_build\\src\\v175_slim\\dist'
          Compress-Archive -Path 'CRV_Cut_Optimizer_v1.7.5_Win7_x86' -DestinationPath 'CRV_Cut_Optimizer_v1.7.5_Win7_x86_one-folder.zip' -Force
          $hash = (Get-FileHash 'CRV_Cut_Optimizer_v1.7.5_Win7_x86_one-folder.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  CRV_Cut_Optimizer_v1.7.5_Win7_x86_one-folder.zip" | Set-Content 'CRV_Cut_Optimizer_v1.7.5_Win7_x86_SHA256.txt' -Encoding ascii
          Get-ChildItem 'CRV_Cut_Optimizer_v1.7.5_Win7_x86_one-folder.zip','CRV_Cut_Optimizer_v1.7.5_Win7_x86_SHA256.txt'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRV_Cut_Optimizer_v1.7.5_Win7_x86
          path: |
            win7_build/src/v175_slim/dist/CRV_Cut_Optimizer_v1.7.5_Win7_x86_one-folder.zip
            win7_build/src/v175_slim/dist/CRV_Cut_Optimizer_v1.7.5_Win7_x86_SHA256.txt
          if-no-files-found: error
          retention-days: 3
